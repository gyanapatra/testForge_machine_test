<div class="login-page">
  <div class="login-card">

    <div class="brand">
      <div class="brand-icon">T</div>
      <h1>TestForge</h1>
      <p>Machine Test Application</p>
    </div>

    <div class="form-heading">
      <h2>Welcome back</h2>
      <p>Enter your credentials to continue.</p>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">

      <div class="form-group">
        <label for="username">Username</label>

        <input id="username" type="text" name="username" [(ngModel)]="username" placeholder="Enter your username"
          autocomplete="username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="Enter your password"
          autocomplete="current-password" required />
      </div>

      <div class="error-message" *ngIf="errorMessage" role="alert">
        {{ errorMessage }}
      </div>

      <div class="success-message" *ngIf="successMessage" role="status">
        {{ successMessage }}
      </div>

      <button type="submit" class="login-button" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>

    </form>

    <div class="signup-link">
      Don't have an account?
      <a routerLink="/signup">Create an account</a>
    </div>

    <div class="footer">
      TestForge · Machine Test Application
    </div>

  </div>
</div>
