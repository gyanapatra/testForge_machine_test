services:
  postgres:
    image: postgres:16
    container_name: testforge-postgres
    environment:
      POSTGRES_DB: testforge
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in your environment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - testforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testforge -d testforge"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  testforge_pgdata:
